<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <!-- 现代浏览器推荐写法 -->
    <link rel="icon" href="/favicon.ico">

    <!-- PNG 格式 favicon（支持透明度） -->
    <link rel="icon" type="image/png" sizes="16x16" href="/pwa-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/pwa-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/pwa-48x48.png">
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color 由下方内联脚本按解析后的主题实时改写 -->
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <script>
      // 首帧前应用主题,避免手动选过非系统主题时启动闪色:
      // localStorage 镜像存的是已解析的 'light'/'dark'(由 settings store 写入),
      // 无镜像时回退到系统 prefers-color-scheme。
      ;(function () {
        try {
          var pref = localStorage.getItem('app-theme')
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0a0a0a' : '#f5f5f5')
        } catch (e) {}
      })()
    </script>
    <title>MFA Authenticator</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
