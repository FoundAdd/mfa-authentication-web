name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      commit_hash:
        description: '用于构建的 commit hash'
        required: true
        type: string
      release_tag:
        description: '发布标签名(如 v1.0.0),用于创建 Release 并上传产物'
        required: true
        type: string

env:
  BUILD_COMMIT: ${{ inputs.commit_hash || github.sha }}
  # tag 推送时 ref_name 即标签;手动触发时取 release_tag 输入
  TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  checks:
    name: Preflight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_COMMIT }}
      - name: Validate release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::手动触发构建时必须填写 release_tag(如 v1.0.0),Release 产物上传依赖该标签"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  deploy-web:
    name: Deploy web release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_COMMIT }}
          # 发布说明需要完整提交历史与 tag 列表
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ env.TAG }}
        # 总结上一个 Release 与本次发布之间的提交,功能性更新作为发布说明
        run: node scripts/release-notes.mjs
      - run: npm install
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            missing="$missing CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            missing="$missing CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # CI 中为 detached HEAD,wrangler 推断分支会得到 "head" 导致部署成
          # Preview;显式指定生产分支(须与 Pages 项目设置中的生产分支一致,
          # 可用仓库变量 CLOUDFLARE_PAGES_BRANCH 覆盖)
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'mfa-authenticator' }} --branch=${{ vars.CLOUDFLARE_PAGES_BRANCH || 'master' }}
      - name: Package web assets
        run: zip -r mfa-authenticator-${TAG}-web.zip dist
      - name: Upload web release asset
        uses: softprops/action-gh-release@v2
        with:
          files: mfa-authenticator-${{ env.TAG }}-web.zip
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ env.BUILD_COMMIT }}
          body_path: release-notes.md

  build-apk:
    name: Build signed APK
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_COMMIT }}
          # 发布说明需要完整提交历史与 tag 列表
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ env.TAG }}
        # 总结上一个 Release 与本次发布之间的提交,功能性更新作为发布说明
        run: node scripts/release-notes.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 7 的 android 模块均以 Java 21 编译
          java-version: '21'
          cache: gradle
      - run: npm install
      - run: npm run build
      - run: npx cap sync android
      - name: Set up Android SDK
        env:
          ANDROID_SDK_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          ANDROID_SDK_TOOLS_MIRROR: https://mirrors.cloud.tencent.com/AndroidSDK/commandlinetools-linux-11076708_latest.zip
        run: |
          sdk_dir="$ANDROID_HOME"
          # GitHub-hosted runners ship an SDK with cmdline-tools preinstalled;
          # Gitea runner images (docker.gitea.com/runner-images) do not, and
          # gradle fails with "SDK location not found" unless we install one.
          if [ -z "$sdk_dir" ] || [ ! -x "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" ]; then
            sdk_dir="$RUNNER_TEMP/android-sdk"
            echo "Installing Android SDK into $sdk_dir"
            mkdir -p "$sdk_dir/cmdline-tools"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" "$ANDROID_SDK_TOOLS_URL" \
              || curl -fsSL --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" "$ANDROID_SDK_TOOLS_MIRROR"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/sdk-tmp"
            mv "$RUNNER_TEMP/sdk-tmp/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
            rm -rf "$RUNNER_TEMP/sdk-tmp" "$RUNNER_TEMP/cmdline-tools.zip"
            echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
          else
            echo "Using preinstalled Android SDK at $sdk_dir"
          fi
          sdkmanager="$sdk_dir/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_dir" --licenses > /dev/null || true
          "$sdkmanager" --sdk_root="$sdk_dir" --install platform-tools "platforms;android-35" "build-tools;35.0.0"
      - name: Check keystore secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          missing=""
          if [ -z "$KEYSTORE_BASE64" ]; then
            missing="$missing KEYSTORE_BASE64"
          fi
          if [ -z "$KEYSTORE_ALIAS" ]; then
            missing="$missing KEYSTORE_ALIAS"
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            missing="$missing KEYSTORE_PASSWORD"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Rename release APK
        run: |
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi
          mv "$apk" "mfa-authenticator-${TAG}.apk"
      - name: Verify APK signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found in ANDROID_HOME/build-tools"
            exit 1
          fi
          "$apksigner" verify --print-certs "mfa-authenticator-${TAG}.apk"
      - name: Upload APK release asset
        uses: softprops/action-gh-release@v2
        with:
          files: mfa-authenticator-${{ env.TAG }}.apk
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ env.BUILD_COMMIT }}
          body_path: release-notes.md
